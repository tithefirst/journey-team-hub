const D = {"vision": {"mission": "A Spirit-filled community, committed to awakening hearts and transforming lives across every generation, bringing God's presence everywhere, to everyone.", "verses": [["Malachi 4:6", "He will turn the hearts of the parents to their children, and the hearts of the children to their parents.", "The generations turned toward each other. This is the reconciliation we are asking God for in our homes."], ["Acts 2:17", "I will pour out my Spirit on all people. Your sons and daughters will prophesy, your young men will see visions, your old men will dream dreams.", "Spirit-filled and multigenerational in the same breath. Nobody is too young or too old to be used."], ["Deuteronomy 6:6–7", "These commandments that I give you today are to be on your hearts. Impress them on your children. Talk about them when you sit at home and when you walk along the road, when you lie down and when you get up.", "Discipleship at the kitchen table. The home is the classroom; the church equips it."], ["Psalm 145:4", "One generation commends your works to another; they tell of your mighty acts.", "What God has done for us is meant to be handed forward, not kept."]], "vision": ["The Holy Spirit is not a guest at Journey. He is the one leading. Every gathering we put on this calendar, Sunday morning, First Friday, a living room on a Tuesday night, exists to make room for Him to move.", "And the deepest discipleship in this church will not happen in a classroom. It will happen at kitchen tables, in cars, at bedsides: ordinary homes where parents teach their kids to recognize God's voice. Journey Kids equips the home. It does not replace it.", "So here is what we are building toward through 2027. Every gathering makes room for the Holy Spirit. Every home has a next step for discipling the people in it. And every person who walks through our doors hears the same thing: God isn't done with your story."], "pillars": [["Room for the Holy Spirit", "Prayer before polish"     `<div class="card"><h4>${r[0]}</h4>${r[1]?`<div class="role">${r[1]}</div>`:""}${r[2]?`<p>${r[2]}</p>`:""}</div>`).join("")}</div>`);
sections.raise = s;

// Social media
s = el("section","", `<h2>Social Media Playbook</h2>
  <div class="note">For Chloe (Social Media Coordinator, reports to Nina Damkoehler) &mdash; 2&ndash;3 posts a week, same skeleton every week: look back, look in, look ahead.</div>
  <h3>The weekly rhythm</h3>
  ${table(["Post","When","What it is"], D.socialWeekly)}
  <h3>Event coverage</h3>
  ${table(["Event","Posting plan"], D.socialEvents)}
  <h3>Big posts by month</h3>
  ${table(["Month","Don't-miss posts"], D.socialMonths)}
  <h3>Ground rules</h3>
  <ol class="open">${D.socialNotes.map(x=>`<li>${x}</li>`).join("")}</ol>`);
sections.social = s;

// Recent staff notes
s = el("section","", `<h2>Recent Staff Notes</h2>
  <div class="subnav" id="weeknav">${NOTES.weeks.map((w,i)=>
    `<button data-week="${w.id}" class="${i===0?'active':''}">${w.label}</button>`).join("")}</div>
  ${NOTES.weeks.map((w,i)=>`<div class="week ${i===0?'active':''}" data-week="${w.id}">
    <div class="note">${w.meta}</div>
    ${w.blocks.map(b=>`<h3>${b.h}</h3>` + (b.t==="table"
      ? table(b.cols, b.rows)
      : `<ol class="open">${b.rows.map(x=>`<li>${x}</li>`).join("")}</ol>`)).join("")}
  </div>`).join("")}`);
sections.notes = s;

// Open items
s = el("section","", `<h2>Open Items</h2><ol class="open">` +
  D.openItems.map(x=>`<li>${x}</li>`).join("") + `</ol>`);
sections.open = s;

tabs.forEach(([id,label])=>{
  const b=el("button","",label); b.onclick=()=>activate(id);
  b.dataset.tab=id; nav.appendChild(b);
  sections[id].dataset.tab=id; sections[id].id=id; main.appendChild(sections[id]);
});
function activate(id){
  nav.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.tab===id));
  main.querySelectorAll("section").forEach(s=>s.classList.toggle("active",s.dataset.tab===id));
}
activate(tabs.some(t=>t[0]===location.hash.slice(1)) ? location.hash.slice(1) : "vision");
const weeknav = document.getElementById("weeknav");
if (weeknav) weeknav.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const id = b.dataset.week;
  weeknav.querySelectorAll("button").forEach(x=>x.classList.toggle("active", x===b));
  document.querySelectorAll("#notes .week").forEach(w=>w.classList.toggle("active", w.dataset.week===id));
});
</script>
</body></html>
