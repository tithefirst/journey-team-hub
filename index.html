<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Journey Church &mdash; Fall &amp; Winter 2026 Team Hub</title>
<style>
  :root { --ink:#1C1C1C; --gold:#B08A2E; --deep:#26241E; --cream:#FBF4DE; --pale:#F7ECCB; --gray:#6E6857; --line:#E9DFC2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif; color:var(--ink); background:#FEF8E8; }
  header { background:var(--deep); color:#FBF4DE; padding:26px 30px 0; }
  .brand { color:var(--gold); font-weight:700; letter-spacing:4px; font-size:13px; }
  header h1 { margin:6px 0 2px; font-size:28px; color:#fff; }
  header .tag { font-style:italic; color:var(--gold); font-size:14px; margin-bottom:4px; }
  header .stamp { font-size:11.5px; color:#9E967F; margin-bottom:16px; letter-spacing:.5px; }
  nav { display:flex; gap:4px; flex-wrap:wrap; }
  nav button { border:none; background:transparent; color:#CFC7AE; padding:11px 18px; font-size:14px; font-weight:600; cursor:pointer; border-radius:10px 10px 0 0; font-family:inherit; }
  nav button:hover { color:#fff; }
  nav button.active { background:#FEF8E8; color:var(--ink); }
  main { max-width:1200px; margin:0 auto; padding:26px 30px 60px; }
  section { display:none; }
  section.active { display:block; }
  h2 { font-size:22px; margin:6px 0 14px; }
  h3 { font-size:16px; color:var(--gold); margin:22px 0 8px; text-transform:uppercase; letter-spacing:1.5px; }
  table { border-collapse:collapse; width:100%; background:#fff; border-radius:10px; overflow:hidden; font-size:13.5px; margin-bottom:8px; }
  th { background:var(--deep); color:#FBF4DE; text-align:left; padding:9px 12px; font-size:12.5px; letter-spacing:.5px; }
  td { padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:nth-child(even) td { background:var(--cream); }
  tr.guest td { background:var(--pale); }
  tr.big td { background:var(--deep); color:#FBF4DE; font-weight:700; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card h4 { margin:0 0 2px; font-size:15px; }
  .card .role { color:var(--gold); font-weight:700; font-size:12.5px; }
  .card .rep { color:var(--gray); font-size:12px; margin:4px 0; }
  .card p { margin:4px 0 0; font-size:13px; color:#3d3a30; }
  .card.open { border-color:var(--gold); border-style:dashed; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:14px 0 6px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; text-align:center; }
  .stat .n { font-size:44px; font-weight:800; color:var(--deep); line-height:1; }
  .stat.hl .n { color:var(--gold); }
  .stat .l { font-size:13px; font-weight:600; margin-top:6px; }
  .stat .s { font-size:11px; color:var(--gray); margin-top:3px; }
  .note { font-size:12.5px; color:var(--gray); font-style:italic; margin:8px 0 18px; }
  .banner { background:var(--deep); color:#FBF4DE; border-radius:14px; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; margin:16px 0; flex-wrap:wrap; gap:8px; }
  .banner b { font-size:18px; }
  ol.open { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 16px 16px 36px; margin:0; }
  ol.open li { padding:6px 0; font-size:14px; border-bottom:1px dashed var(--line); }
  ol.open li:last-child { border-bottom:none; }
  svg { width:100%; height:auto; background:#fff; border-radius:12px; border:1px solid var(--line); }
  .pill { display:inline-block; background:var(--gold); color:#fff; font-size:10px; font-weight:700; letter-spacing:1px; border-radius:99px; padding:2px 8px; vertical-align:2px; margin-left:6px; }
  .creed { background:var(--deep); color:#FBF4DE; border-radius:16px; padding:26px 30px; margin:8px 0 22px; }
  .creed .lbl { color:var(--gold); font-size:11.5px; font-weight:700; letter-spacing:3px; margin-bottom:10px; }
  .creed .big { font-size:23px; line-height:1.45; font-weight:600; margin:0; }
  .vision p { font-size:15.5px; line-height:1.6; margin:0 0 12px; max-width:78ch; }
  .verse { background:#fff; border:1px solid var(--line); border-top:4px solid var(--gold); border-radius:12px; padding:16px 18px; }
  .verse blockquote { margin:0 0 8px; font-size:14.5px; line-height:1.55; font-style:italic; color:var(--ink); }
  .verse cite { display:block; color:var(--gold); font-weight:700; font-size:12.5px; font-style:normal; letter-spacing:1px; text-transform:uppercase; }
  .verse p { margin:8px 0 0; font-size:13px; color:#3d3a30; line-height:1.5; }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal .dow { font-size:10.5px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--gold); text-align:center; padding:4px 0 2px; }
  .cal .cell { background:#fff; border:1px solid var(--line); border-radius:8px; min-height:92px; padding:5px 6px; }
  .cal .cell.empty { background:transparent; border:none; }
  .cal .cell.has { border-color:#DCCFA6; }
  .cal .dnum { font-size:11.5px; font-weight:700; color:var(--gray); margin-bottom:3px; }
  .cal .cell.has .dnum { color:var(--ink); }
  .cal .chip { font-size:10.5px; line-height:1.3; border-radius:5px; padding:3px 5px; margin-bottom:3px;
    background:var(--cream); border-left:3px solid var(--gold); color:#3d3a30; }
  .cal .chip .who { display:block; color:var(--gray); font-size:9.5px; }
  .cal .chip.sermon { background:#fff; border-left-color:#4A4433; }
  .cal .chip.guest { background:var(--pale); border-left-color:#96772F; }
  .cal .chip.big { background:var(--deep); color:#FBF4DE; border-left-color:var(--gold); font-weight:700; }
  .cal .chip.big .who { color:#CFC7AE; }
  @media (max-width:760px) {
    .cal { gap:3px; }
    .cal .cell { min-height:62px; padding:3px 4px; }
    .cal .chip { font-size:9px; padding:2px 3px; }
    .cal .chip .who { display:none; }
  }
  .subnav { display:flex; gap:8px; flex-wrap:wrap; margin:2px 0 16px; }
  .subnav button { font-family:inherit; font-size:13px; font-weight:700; letter-spacing:.3px; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--gray); padding:7px 16px; border-radius:99px; }
  .subnav button:hover { color:var(--ink); border-color:var(--gold); }
  .subnav button.active { background:var(--deep); border-color:var(--deep); color:#FBF4DE; }
  .week, .month, .evt { display:none; }
  .week.active, .month.active, .evt.active { display:block; }
  .pillar { background:#fff; border:1px solid var(--line); border-left:5px solid var(--gold); border-radius:12px; padding:14px 18px; }
  .pillar h4 { margin:0 0 2px; font-size:16px; }
  .pillar .sub { color:var(--gold); font-weight:700; font-size:12.5px; margin-bottom:6px; }
  .pillar p { margin:0; font-size:13.5px; color:#3d3a30; line-height:1.5; }
  @media print {
    nav { display:none; }
    section { display:block !important; page-break-after:always; }
    section:last-of-type { page-break-after:auto; }
    header { padding:18px 24px 14px; }
    header h1 { font-size:21px; }
    main { padding:18px 24px 24px; max-width:none; }
    tr, .card, .pillar, .verse, .stat, .banner { page-break-inside:avoid; }
    h3 { page-break-after:avoid; }
    .subnav { display:none; }
    .week { display:block !important; page-break-before:always; }
    .month { display:block !important; page-break-before:always; }
    .month:first-of-type { page-break-before:auto; }
    .month .mlist { display:none; }
    .cal .cell { min-height:78px; }
    .week:first-of-type { page-break-before:auto; }
    .evt { display:block !important; page-break-before:always; }
    .evt:first-of-type { page-break-before:auto; }
  }
</style>
</head>

const D = {"vision": {"mission": "A Spirit-filled community, committed to awakening hearts and transforming lives across every generation, bringing God's presence everywhere, to everyone.", "verses": [["Malachi 4:6", "He will turn the hearts of the parents to their children, and the hearts of the children to their parents.", "The generations turned toward each other. This is the reconciliation we are asking God for in our homes."], ["Acts 2:17", "I will pour out my Spirit on all people. Your sons and daughters will prophesy, your young men will see visions, your old men will dream dreams.", "Spirit-filled and multigenerational in the same breath. Nobody is too young or too old to be used."], ["Deuteronomy 6:6–7", "These commandments that I give you today are to be on your hearts. Impress them on your children. Talk about them when you sit at home and when you walk along the road, when you lie down and when you get up.", "Discipleship at the kitchen table. The home is the classroom; the church equips it."], ["Psalm 145:4", "One generation commends your works to another; they tell of your mighty acts.", "What God has done for us is meant to be handed forward, not kept."]], "vision": ["The Holy Spirit is not a guest at Journey. He is the one leading. Every gathering we put on this calendar, Sunday morning, First Friday, a living room on a Tuesday night, exists to make room for Him to move.", "And the deepest discipleship in this church will not happen in a classroom. It will happen at kitchen tables, in cars, at bedsides: ordinary homes where parents teach their kids to recognize God's voice. Journey Kids equips the home. It does not replace it.", "So here is what we are building toward through 2027. Every gathering makes room for the Holy Spirit. Every home has a next step for discipling the people in it. And every person who walks through our doors hears the same thing: God isn't done with your story."], "pillars": [["Room for the Holy Spirit", "Prayer before polish" ext-anchor=\"start\" font-style=\"italic\">Fall/Winter 2026 · Jesus is the head of the church. Pastor Jason is Lead Pastor, reporting to Jesus and accountable to the elders as a co-elder, and leads the church and the staff.</text><text x=\"75\" y=\"970\" font-size=\"12\" fill=\"#8A8168\" text-anchor=\"start\" font-style=\"italic\">Senior staff: Pastor Jason, Pastor Nancy, Elliot Sanders and Pastor Ryan. Pastor Nancy carries women's ministry, counseling and family ministry, with authority over all Family Ministry.</text><text x=\"75\" y=\"988\" font-size=\"12\" fill=\"#8A8168\" text-anchor=\"start\" font-style=\"italic\">Elliot Sanders holds one elder seat covering governance and day-to-day operations, and also serves as Sunday Morning Experience Lead; Ray Sanders reports to him.</text><text x=\"75\" y=\"1006\" font-size=\"12\" fill=\"#8A8168\" text-anchor=\"start\" font-style=\"italic\">Nina Damkoehler leads worship, First Fridays and social media under Pastor Ryan; Chloe Annavarapu reports to her.</text><text x=\"75\" y=\"1024\" font-size=\"12\" fill=\"#8A8168\" text-anchor=\"start\" font-style=\"italic\">Follow-Up Lead is open and reports to Pastor Nancy. Hospitality, Sunday Table and the greeting team report into the Sunday Morning Experience Lead, held by Elliot Sanders.</text><text x=\"75\" y=\"1042\" font-size=\"12\" fill=\"#8A8168\" text-anchor=\"start\" font-style=\"italic\">Rachel Strong is on staff and on sabbatical; Ginger Heblasko covers day-to-day hospitality · Young Adult/College is a shared leadership team reporting to Pastor Jason, with volunteers Cliff &amp; Clair Dais · Dashed = role to fill.</text></svg>";

     {"h":"To do","t":"table","cols":["Who","What","Notes"],"rows":[

       ["Jason","Ask Chris Martin about leading a three-week new believers class","Nancy's idea. Jason would do it himself otherwise"],

     {"h":"Wins and thank-yous","t":"list","rows":[
       "Pastor Appreciation Day: Jason and Nancy's thanks to Ryan and Elliot for putting it together, and to everyone for the notes. The kids read them too. It teaches the church to honor, and it shows a staff that stands together.",
       "Josh &amp; Caroline: Elliot and Taylor had lunch with them Sunday and it went as well as it could. Elliot offered to split Sundays with them; they said put us down for every week until the greeting team runs on its own. They were glad the role is more than saying good morning at the door. They do not need to be at staff meetings.",
       "Nina's photo for the website is taken (Ryan). Emily got a LinkedIn headshot out of it too.",
       "Social media is banging. Ninety percent of it is right where it should be (font note below).",
       "Carol Martin is doing an incredible job with Journey Kids curriculum: she bulk-preps and separates crafts by week for the Sundays she is away, and writes everything down so anyone can follow it.",
       "Marriage turnarounds this week. Five people raised their hands for salvation on Sunday, two of them new women."]},
     {"h":"Volunteer Night &mdash; what changed tonight","t":"list","rows":[
       "Staff arrive at <b>5:30</b> (everyone by 5:45). Nancy, Nina, Cassi and Elliot set up tables, dessert, coffee and apple cider. Nancy is buying the dessert and cider.",
       "Elliot opens in prayer. Ryan prays us out at the end, and Nancy and Ryan both pray over everybody.",
       "Jason introduces every staff member by name and title in the welcome, and the whole staff (Bryce included) sits up front on stools the entire night. At every point Jason asks, would you add anything?",
       "Thank-yous: Jason starts, the leads add theirs impromptu, then the floor is open.",
       "Devotional stays at five to seven minutes, no slides.",
       "Vision segment leads with the theme and the vision (Ryan: give them the bullseye). Big dates are secondary. Heads-up items: Choir Sunday is being announced Sunday, a Christmas gift is coming.",
       "Org chart and a two-minute look at the Team Hub so they see we plan and coordinate, not just wing it. Jason makes a couple of simple slides.",
       "The house expectations segment is <b>out</b> of the front half. It read as punitive, and it would leave nothing for the breakouts. Jason gives each lead a cheat sheet of staff expectations; leads cover them at their table.",
       "Worship and tech is <b>one combined breakout</b> (Nina and Ryan). Ryan covers the platform dress code there.",
       "Breakouts are at tables in the same room, not separate rooms. Each lead introduces every person, walks through what the team does, goes through the details, and prays with them.",
       "Nancy and Ryan both pray over everyone to close. Someone takes pictures."]},
     {"h":"Worship and sound","t":"list","rows":[
       "Mason's first Sunday alone on sound went fine. Clair said the balance was great. Pastor Ryan and E. both jumped in, which is fine, but while Mason is new one of them should sit with him the whole service. Reminder for Mason: record the sermon.",
       "E. and the tracks note: Pastor Ryan talked with him. It landed as agree to disagree, but he said okay. He likes to be at the board when he is not scheduled, and Mason mentioned getting pointers. Watch it.",
       "Tucker: an hour's drive and an 8:00 call is a lot. He asked to come later and have the worship team turn things on. Pastor Ryan said not for now: if something new is happening that Sunday we cannot find out at 9:45 that the mics are down. With Mason and Ryan back in the mix he only needs to come early about once a month. Nina has him on one Sunday in November.",
       "Washed is back this Sunday. The fast song Nina wants is not on MultiTracks yet (no license). Ben is off this week.",
       "Platform dress code: Nina asked Jason and Nancy to raise it Thursday. It gets covered as a platform team expectation in the Worship &amp; Tech breakout, and Pastor Ryan is glad to be the one to say it."]},
     {"h":"Choir Sunday &mdash; decisions","t":"list","rows":[
       "It is a go. Jason, Ryan's mom and Dixie Ringger (who says there is a whole crew that wants in) are all for it. Nina leads it.",
       "Once a month, probably the third or fourth Sunday. Start in December with a Christmas song. Communion or baptism Sunday makes no difference to Jason.",
       "Announce it this Sunday with a sign-up list so nobody gets missed, and people get a call. Say out loud that it is a pilot and feedback is welcome.",
       "Keep it simple: one mic, singers sing in the range they are comfortable in, no heavy part work. The point is involvement and fullness, and a step for people who are not ready for a mic on the worship team.",
       "To settle: a cap on the number (five? eight?); where they stand (more than four or five means off to the side, and no mic in front of a speaker); no in-ears, and that is fine; a clear rehearsal plan with explicit instructions, since most of the choir will be older; dress expectations said up front.",
       "If someone signs up who really cannot sing, tell Jason. We are too small to hide it."]},
     {"h":"Social media","t":"list","rows":[
       "Jason's one note: the font is too small to read on Instagram. Ryan: secondary or tertiary text along the bottom has no reason to be small. If the design wants white space, make it a multi-slide post: big headline on slide one, details on slide two.",
       "Nina meets Chloe Thursday for November planning and will cover it. Chloe sends designs to Pastor Ryan to check font size.",
       "Keep time, date and location on event posts (Men's Breakfast and the like). Small groups stay general rather than listing three addresses."]},
     {"h":"Journey Kids (Cassi)","t":"list","rows":[
       "Carol's curriculum work is excellent and easy to replicate because it is all written down. When she is away, Cassi just makes sure the teachers in the room have seen the curriculum before Sunday.",
       "Still recruiting. The weekend problem is not knowing whether scheduled volunteers are actually coming: accept the request, confirm you are coming.",
       "Family Sunday: waiting on the elders. Elder meeting to be scheduled.",
       "Thursday: Carol and Sarah Vera have invites. Sarah moved their vacation up a day to be there."]},
     {"h":"Next step for new believers","t":"list","rows":[
       "Nancy stands in the back and sees who raises a hand. Some are raising it for the second or third time, with tears. We have a next step to take as a church and it is discipleship. Starting the Journey at minimum.",
       "Two simple things: <b>Pizza with the Staff</b> for new people (plan it next meeting), and a <b>three-week new believers class</b>. Chris Martin to lead it if he will (Nancy's idea); Jason would do it otherwise.",
       "Until then: get people who love Jesus around them, and invite them into something they can own (Ryan: a sports thing for the young married guys)."]},
     {"h":"People to follow up with","t":"table","cols":["Who","Why","Owner"],"rows":[
       ["Jarell","Reached out to Jason about doing a spoken word thing on campus; has a lot on his mind. Keep him in prayer","Elliot (coffee next week)"],
       ["Nico","Jason wanted to grab lunch with him; Elliot has the relationship. Missed the last young married couples night, which was hard on Veronica","Elliot"],
       ["Cindy","Not seen for a while","Jason"],
       ["Nikki Schaefer and her husband","Nancy has not seen them in six weeks","Pastor Nancy"],
       ["Young dad from Gridley","Raised his hand for salvation Sunday, not the first time. Little girl","Open; Nancy needs a volunteer"],
       ["Couple from Atlanta","Through Renee. Listening to the sermons; feel called to join our staff. Elliot: come for a couple of months, start on the greeting team, go from there","Pastor Nancy to the elders"]]},
     {"h":"Team Hub","t":"list","rows":[
       "The link now always opens the latest version, and the hub republishes whenever Jason updates it.",
       "It is private, not confidential. Anyone with the link can read everything, so do not share it. It went to the all-leadership chat (staff plus Bryce &amp; Julie, Chloe, and Jason's parents), which is fine. If you shared it anywhere else, tell Jason and he will change it.",

const EV = (function(){

function grid(y,m){
  const first = new Date(y,m,1).getDay(), days = new Date(y,m+1,0).getDate();
  const dow = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="dow">${d}</div>`).join("");
  let c = [];
  for (let i=0;i<first;i++) c.push('<div class="cell empty"></div>');
  for (let d=1; d<=days; d++){
    const list = EV[y+"-"+m+"-"+d] || [];
    c.push(`<div class="cell${list.length?" has":""}"><div class="dnum">${d}</div>` +
      list.map(e=>`<div class="chip ${e.k}">${e.t}${e.who?`<span class="who">${e.who}</span>`:""}</div>`).join("") +
      `</div>`);
  }
  while (c.length % 7) c.push('<div class="cell empty"></div>');
  return `<div class="cal">${dow}${c.join("")}</div>`;
}
function monthList(y,m){
  const days = new Date(y,m+1,0).getDate(), rows = [];
  for (let d=1; d<=days; d++){
    const list = EV[y+"-"+m+"-"+d] || []; if (!list.length) continue;
    const label = new Date(y,m,d).toLocaleDateString("en-US",{weekday:"short"}) + " " + d;
    list.forEach((e,i) => rows.push([i?"":label, e.t, e.who||""]));
  }
  return rows.length ? table(["Date","Event","Lead"], rows,
    r => r[1].toUpperCase().indexOf("CHRISTMAS")>-1 ? "big" : (r[1].toUpperCase().indexOf("GUEST")>-1 ? "guest" : ""))
    : `<div class="note">Nothing scheduled for this month yet.</div>`;
}

tabs.forEach(([id,label])=>{
  const b=el("button","",label); b.onclick=()=>activate(id);
  b.dataset.tab=id; nav.appendChild(b);
  sections[id].dataset.tab=id; sections[id].id=id; main.appendChild(sections[id]);
});
function activate(id){
  nav.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.tab===id));
  main.querySelectorAll("section").forEach(s=>s.classList.toggle("active",s.dataset.tab===id));
}
activate(tabs.some(t=>t[0]===location.hash.slice(1)) ? location.hash.slice(1) : "vision");
const calnav = document.getElementById("calnav"), calview = document.getElementById("calview");
function showMonth(id){
  calnav.querySelectorAll("button").forEach(b=>b.classList.toggle("active", b.dataset.month===id));
  document.querySelectorAll("#calendar .month").forEach(m=>m.classList.toggle("active", m.dataset.month===id));
}
function showView(v){
  calview.querySelectorAll("button").forEach(b=>b.classList.toggle("active", b.dataset.view===v));
  document.querySelectorAll("#calendar .mgrid").forEach(e=>e.style.display = v==="grid" ? "" : "none");
  document.querySelectorAll("#calendar .mlist").forEach(e=>e.style.display = v==="list" ? "" : "none");
}
if (calnav) calnav.addEventListener("click", e => {
  const b = e.target.closest("button"); if (b) showMonth(b.dataset.month); });
if (calview) calview.addEventListener("click", e => {
  const b = e.target.closest("button"); if (b) showView(b.dataset.view); });
if (calview) showView("grid");
const evtnav = document.getElementById("evtnav");
if (evtnav) evtnav.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const id = b.dataset.evt;
  evtnav.querySelectorAll("button").forEach(x=>x.classList.toggle("active", x===b));
  document.querySelectorAll("#events .evt").forEach(w=>w.classList.toggle("active", w.dataset.evt===id));
});
const weeknav = document.getElementById("weeknav");
if (weeknav) weeknav.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const id = b.dataset.week;
  weeknav.querySelectorAll("button").forEach(x=>x.classList.toggle("active", x===b));
  document.querySelectorAll("#notes .week").forEach(w=>w.classList.toggle("active", w.dataset.week===id));
});
